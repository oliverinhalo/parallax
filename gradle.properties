# JVM sizing: the reconstruction engine's KSP/Room processing and 16 modules of
# Kotlin compilation need headroom, and the configuration cache keeps the daemon
# resident between invocations.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1536m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# AGP 9 defaults targetSdk to compileSdk when unset; we set it explicitly
# everywhere, so this only guards against future modules forgetting.
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true

kotlin.code.style=official
# KSP2 is the only supported mode under AGP 9's built-in Kotlin.
ksp.useKSP2=true

# Flip on to make every Kotlin warning fatal; CI sets it, local builds do not.
parallax.warningsAsErrors=false
