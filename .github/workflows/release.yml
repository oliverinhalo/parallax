name: Release

# Publishes an installable APK to the GitHub Releases page. Tagging is the
# trigger because a release should name a commit you chose, not whatever
# happened to be on a branch when a workflow ran.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as (created if it does not exist)'
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install the NDK and CMake the build asks for
        run: |
          NDK_VERSION=$(grep '^ndk = ' gradle/libs.versions.toml | cut -d'"' -f2)
          CMAKE_VERSION=$(grep '^cmake = ' gradle/libs.versions.toml | cut -d'"' -f2)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Prepare the signing key
        # The real key comes from repository secrets. Without them the job
        # still produces something installable, signed with a key generated
        # here and thrown away -- which means the next release will not
        # install over this one, so it says so loudly and in the release
        # notes rather than quietly shipping an unupgradeable build.
        env:
          KEYSTORE_BASE64: ${{ secrets.PARALLAX_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          KEYSTORE="$RUNNER_TEMP/signing/parallax.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "PARALLAX_KEYSTORE_PASSWORD=${{ secrets.PARALLAX_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "PARALLAX_KEY_ALIAS=${{ secrets.PARALLAX_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "PARALLAX_KEY_PASSWORD=${{ secrets.PARALLAX_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo 'EPHEMERAL_KEY=false' >> "$GITHUB_ENV"
          else
            PASSWORD=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
            keytool -genkeypair -v -keystore "$KEYSTORE" -alias parallax \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -dname 'CN=Parallax, OU=Unsigned release, O=Parallax, C=GB'
            echo "::warning::No PARALLAX_KEYSTORE_BASE64 secret, so this APK is signed with a throwaway key. It installs, but a later release will not install over it."
            echo "PARALLAX_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
            echo 'PARALLAX_KEY_ALIAS=parallax' >> "$GITHUB_ENV"
            echo "PARALLAX_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
            echo 'EPHEMERAL_KEY=true' >> "$GITHUB_ENV"
          fi
          echo "PARALLAX_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Assemble the release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name the artefact after the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            TAG="${{ inputs.tag }}"
          fi
          cp app/build/outputs/apk/release/app-release.apk "parallax-$TAG.apk"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Install \`parallax-$TAG.apk\` directly: Android will ask you to allow"
            echo 'installation from this source the first time.'
            echo
            echo '- arm64-v8a and x86_64, minSdk 29, shrunk with R8.'
            echo '- Everything runs on the device. No network calls, no accounts, no telemetry.'
            if [ "$EPHEMERAL_KEY" = 'true' ]; then
              echo
              echo '> Signed with a key generated for this build and discarded, because no'
              echo '> signing secrets are configured. It installs, but a later release will'
              echo '> not install over it -- uninstall first, or set the signing secrets.'
            fi
          } > notes.md
          gh release create "$TAG" "parallax-$TAG.apk" \
            --title "Parallax $TAG" --notes-file notes.md \
            --target "$GITHUB_SHA" || \
          gh release upload "$TAG" "parallax-$TAG.apk" --clobber
