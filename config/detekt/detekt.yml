# Parallax detekt configuration. Builds on detekt's defaults; the overrides below
# reflect decisions specific to this codebase rather than blanket relaxations.
build:
  maxIssues: 0

complexity:
  LongMethod:
    # Reconstruction stages and Compose screen bodies are legitimately long;
    # splitting them for a line count would hurt readability.
    threshold: 110
  LongParameterList:
    functionThreshold: 9
    constructorThreshold: 12
    # Compose's convention is explicit parameters with defaults. Bundling a
    # component's callbacks into a holder object hurts previews and recomposition
    # skipping without making the call site any clearer.
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 60
    thresholdInClasses: 40
    # A Room DAO is a list of queries and a JNI object is a list of native
    # symbols; both are flat surfaces where splitting by count would just make
    # the call sites harder to follow.
    thresholdInInterfaces: 30
    thresholdInObjects: 60
    ignoreAnnotatedFunctions: ['Composable']
  CyclomaticComplexMethod:
    threshold: 20
  NestedBlockDepth:
    threshold: 6

style:
  MagicNumber:
    # Design tokens, camera intrinsics and numeric kernels are full of
    # meaningful constants; naming every one of them adds noise.
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreAnnotated: ['Composable', 'Preview']
    # The viewer's geometry: vector component indices and the small factors of
    # linear algebra. `positions[index * 3 + 2]` says what it means; the same
    # line written with Z_COMPONENT and FLOATS_PER_VERTEX says it less well.
    # Listing `excludes` replaces detekt's default, which exempts test
    # sources, so those globs have to be repeated here rather than inherited.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/feature/viewer/camera/**'
      - '**/feature/viewer/edit/**'
      - '**/feature/viewer/pick/**'
      - '**/feature/viewer/measure/**'
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 6
  ForbiddenComment:
    # The build must fail if a stub is left behind.
    values: ['TODO:', 'FIXME:', 'STOPSHIP:']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: true
