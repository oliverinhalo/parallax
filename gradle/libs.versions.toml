# Parallax version catalog.
#
# Every version here was resolved against the live Maven metadata at the time of
# writing rather than copied from memory; see docs/DECISIONS.md (ADR-001) for the
# toolchain choice and docs/LICENSES.md for the licence of each entry.

[versions]
# ---- toolchain -------------------------------------------------------------
agp = "9.4.1"                 # requires Gradle >= 9.6.0, JDK >= 17
gradle = "9.8.2"
kotlin = "2.4.21"
ksp = "2.3.12"
jvmTarget = "17"
compileSdk = "37"
minSdk = "29"
targetSdk = "37"
buildTools = "37.0.0"
ndk = "28.2.13676358"         # AGP 9.4's default NDK; pinned for reproducibility
cmake = "3.22.1"

# ---- androidx / compose ----------------------------------------------------
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
room = "2.8.5"
datastore = "1.3.0"
work = "2.12.0"
camerax = "1.6.2"
exifinterface = "1.4.2"
documentfile = "1.1.0"
splashscreen = "1.2.0"
hiltExt = "1.4.0"
graphicsShapes = "1.0.1"

# ---- di / async ------------------------------------------------------------
hilt = "2.60.1"
coroutines = "1.11.0"
serialization = "1.12.0"

# ---- 3d / ar / ml ----------------------------------------------------------
arcore = "1.57.0"
filament = "1.77.3"
litert = "2.3.0"

# ---- testing / quality -----------------------------------------------------
junit = "4.13.2"
testRunner = "1.7.0"
testExtJunit = "1.3.0"
espresso = "3.7.0"
truth = "1.4.5"
